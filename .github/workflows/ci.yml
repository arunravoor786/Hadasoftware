name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy dist/ to Hostinger after a successful build'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Type-check, build, prerender every route, then run the content guard
      # (fails on phone numbers, WhatsApp links or removed names).
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hadasoft-site
          path: dist
          include-hidden-files: true
          retention-days: 14

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: hadasoft-site
          path: dist
      - run: npm run deploy -- --no-backup
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || 'public_html' }}
